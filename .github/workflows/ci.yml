name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-linux:
    name: Test & Lint (Ubuntu Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Verify Module Dependencies
        run: |
          go mod verify
          git diff --exit-code go.mod go.sum

      - name: Check Code Formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests with Race Detector
        run: go test -v -race ./...

      - name: Validate Linux Build
        run: go build -v -o dmanga-linux ./cmd/dmanga

  test-windows:
    name: Test & Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Verify Module Dependencies
        run: go mod verify

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Validate Windows Build with ldflags
        shell: pwsh
        run: |
          $commit = git rev-parse --short HEAD
          $btime = git log -1 --format=%cI
          go build -ldflags="-s -w -X 'dmanga/internal/cli.Version=v1.0.0-ci' -X 'dmanga/internal/cli.GitCommit=$commit' -X 'dmanga/internal/cli.BuildTime=$btime'" -v -o Dmanga.exe ./cmd/dmanga
          .\Dmanga.exe -v
