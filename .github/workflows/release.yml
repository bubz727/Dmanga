name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  goreleaser:
    name: Build & Release Binaries (GoReleaser)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Validate SemVer Tag
        run: |
          TAG="${{ github.ref_name }}"
          echo "Validating tag: $TAG"
          # Ensure tag strictly conforms to Semantic Versioning vX.Y.Z(-prerelease)
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: Tag '$TAG' is not a valid Semantic Versioning tag (expected format: vX.Y.Z)."
            exit 1
          fi
          echo "Tag $TAG is valid SemVer."

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
