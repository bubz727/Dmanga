version: 2

project_name: Dmanga

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: dmanga
    main: ./cmd/dmanga
    binary: Dmanga
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X 'dmanga/internal/cli.Version={{ if .Tag }}{{ .Tag }}{{ else }}{{ .Version }}{{ end }}'
      - -X 'dmanga/internal/cli.GitCommit={{ .ShortCommit }}'
      - -X 'dmanga/internal/cli.BuildTime={{ .CommitDate }}'

archives:
  - id: default
    format: binary
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "SHA256SUMS.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: git
  groups:
    - title: "Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "Performance"
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: "Refactor & Maintenance"
      regexp: '^.*?(refactor|chore)(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: "Others"
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: bubz727
    name: Dmanga
  draft: true
  prerelease: auto
  mode: replace
  header: |
    Built from {{ .ShortCommit }}.

    ## What's Changed
  footer: |
    {{ if .PreviousTag }}**Full Changelog**: https://github.com/bubz727/Dmanga/compare/{{ .PreviousTag }}...{{ .Tag }}{{ else }}**Full Changelog**: https://github.com/bubz727/Dmanga/commits/{{ .Tag }}{{ end }}
